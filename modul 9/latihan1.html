<!DOCTYPE html>
<html>
<head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title>Web Storage</title>
</head>
<body>
    <center>
        <h1 id="namaMember">Selamat Datang, Member!</h3>
        <button onclick="gantiNama(event)">Masukkan Nama</button>
        <button onclick="hapusNama()">Hapus Nama</button>
    </center>

    <script type="text/javascript">
    const namaMember = document.querySelector('#namaMember');

    // Mengecek apakah sudah ada nama tersimpan di localStorage saat halaman dimuat
    const namaTersimpan = localStorage.getItem('nama');
    if (namaTersimpan) { 
        namaMember.innerHTML = "Halo, " + namaTersimpan;
    }

    function gantiNama(e) {
        let nama = prompt("Masukkan nama Anda: ");
        if (nama && nama.trim() !== "") { // Memastikan nama tidak kosong
        localStorage.setItem('nama', nama);
        namaMember.innerHTML = "Halo, " + nama + "!";
    } else {
        alert("Nama tidak boleh kosong!");
    }
     e.preventDefault();
}

    function hapusNama() {
    localStorage.removeItem('nama');
    namaMember.innerHTML = "Selamat Datang, Member!";
    alert("Nama telah dihapus dari penyimpanan lokal.");
}
    </script>
</body>
</html>
