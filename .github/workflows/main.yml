# Nama Workflow yang akan muncul di tab 'Actions'
name: Laravel CI (SQLite)

# Kapan workflow ini harus dijalankan
on:
  push:
    branches: [ "main", "dev" ] # Dijalankan saat push ke main atau dev
  pull_request:
    branches: [ "main", "dev" ] # Dijalankan saat ada PR ke main atau dev
  workflow_dispatch: # Memungkinkan trigger manual dari GitHub UI

jobs:
  # Nama Job (Pekerjaan) utama
  laravel-ci:
    runs-on: ubuntu-latest # Jalankan di mesin virtual Linux (cepat)
    
    steps:
      # LANGKAH 1: Ambil kode dari repository
      - name: Checkout Code
        uses: actions/checkout@v4

      # LANGKAH 2: Setup Lingkungan PHP
      - name: Setup PHP Environment
        uses: shivammathur/setup-php@v2
        with:
          # Sesuaikan dengan versi PHP project Anda (PHP 8.4) [cite: 24]
          php-version: '8.4' 
          # Instal ekstensi SQLite untuk koneksi DB [cite: 27]
          extensions: gd, mbstring, pdo_sqlite, bcmath 
          tools: composer # Pastikan composer tersedia

      # LANGKAH 3: Install Dependensi Composer (composer install)
      - name: Install Composer Dependencies
        run: composer install --prefer-dist --no-progress --no-suggest
      
      # LANGKAH 4: Siapkan Environment Laravel
      - name: Prepare Laravel Environment
        run: |
          cp .env.example .env
          php artisan key:generate
          
      # LANGKAH 5: Setup Database SQLite & Migrasi/Seeder
      - name: Setup SQLite Database & Run Migrations
        run: |
          # Buat file database.sqlite di folder database/
          mkdir -p database 
          touch database/database.sqlite
          
          # Ubah koneksi ke SQLite di file .env untuk Job ini [cite: 38]
          sed -i 's/DB_CONNECTION=mysql/DB_CONNECTION=sqlite/' .env
          
          # Jalankan Migrasi dan Seeder (termasuk AdminSeeder) 
          php artisan migrate --force --seed 

      # LANGKAH 6: Buat Storage Link (Penting untuk Upload CV)
      - name: Create Storage Link for Uploads
        [cite_start]run: php artisan storage:link # 

      # LANGKAH 7 (Opsional): Jalankan PHPUnit Tests
      # - name: Run PHPUnit Tests
      #   run: vendor/bin/phpunit
